name: Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# JUCE and zqsfx_ui are fetched by CMake (FetchContent, pinned tags); no submodules.
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: plugin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libfreetype-dev libfontconfig1-dev libx11-dev libxcomposite-dev \
            libxcursor-dev libxext-dev libxfixes-dev libxinerama-dev libxrandr-dev \
            libxrender-dev libgl-dev libwebkit2gtk-4.1-dev libgtk-3-dev libcurl4-openssl-dev xvfb

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel 2

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      # pluginval at the portfolio floor (strictness 5) on both built VST3s, macOS only.
      - name: Validate with pluginval (macOS)
        if: runner.os == 'macOS'
        run: |
          curl -sL "https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip" -o pluginval.zip
          unzip -q pluginval.zip
          pluginval.app/Contents/MacOS/pluginval --strictness-level 5 --validate "build/Broken_artefacts/Release/VST3/Broken.vst3"
          pluginval.app/Contents/MacOS/pluginval --strictness-level 5 --validate "build/BrokenFX_artefacts/Release/VST3/Broken FX.vst3"

      - name: Upload Broken VST3
        uses: actions/upload-artifact@v4
        with:
          name: Broken-${{ runner.os }}-VST3
          path: plugin/build/Broken_artefacts/Release/VST3/*.vst3

      - name: Upload Broken FX VST3
        uses: actions/upload-artifact@v4
        with:
          name: BrokenFX-${{ runner.os }}-VST3
          path: plugin/build/BrokenFX_artefacts/Release/VST3/*.vst3
